#cloud-config
package_update: true
package_upgrade: true

chpasswd:
  expire: false

packages:
  - qemu-guest-agent
  - zip
  - unzip
  - curl
  - wget
  - net-tools
  - openssh-server
  - ca-certificates
  - gnupg
  - git
  - lsb-release
  - software-properties-common
  - apt-transport-https
  - build-essential
  - make

users:
  - name: irondome
    ssh_authorized_keys:
      - "<SSH_KEY>"
    groups: users, sudo
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: false
    passwd: "<PASSWD_HASH>"

runcmd:
  - systemctl enable --now qemu-guest-agent
  - echo "irondome /mnt 9p trans=virtio,version=9p2000.L,msize=512000 0 0" >> /etc/fstab
  - mount /mnt
  - su - irondome -c "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
  - su - irondome -c "export PATH=\"\$HOME/.cargo/bin:\$PATH\" && cd /mnt && CARGO_TARGET_DIR=/home/irondome/target cargo build --release"
  - cp /home/irondome/target/release/irondome /usr/local/bin/irondome
  - chmod +x /usr/local/bin/irondome
